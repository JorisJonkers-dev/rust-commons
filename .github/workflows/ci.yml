# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# ONE job: GitHub bills each job rounded up to a full minute, so checks are steps, not jobs.
# `task check` is everything CI runs, so local and CI cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cargo, Python and npm packages come through the estate's package proxy, which never serves
      # a version published less than 7 days ago (JorisJonkers-dev/workspace#167). A pull request
      # from a fork gets no secret, and then this step does nothing.
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@658bec7f448631fbaa3f28d3a2e5708390e0c4c1 # v0.51.0
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: true

      - name: Check
        run: mise exec -- task check
