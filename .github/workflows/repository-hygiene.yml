name: Repository Hygiene

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

# A new commit on a pull request cancels the run still going for the older commit: runners are
# limited and the older result is of no use, and the head commit always gets a fresh run, so a
# cancelled older run cannot block the merge. A title edit has its own group, so it neither cancels
# nor is cancelled by a push. Labels do not trigger this workflow: a bot labelling a new pull
# request starts nothing, so the override label must be on the pull request when it is opened. Add
# or remove it later and the result is stale until the run is re-run by hand (Actions, Re-run all jobs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.run_id || 'commits' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-hygiene:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@48fcba8b143567e12716f4b77b9a3ab211719ffd # v0.50.1
