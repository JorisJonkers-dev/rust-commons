name: Repository Hygiene

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

# A cancelled run of a required check on the head commit blocks the merge even
# when a later run of the same check succeeds, and bots label and edit a pull
# request right after it opens. Each run gets its own group and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-hygiene:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@48fcba8b143567e12716f4b77b9a3ab211719ffd # v0.50.1
