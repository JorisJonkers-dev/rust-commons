[package]
name = "jorisjonkers-commons"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared Rust code for estate services."
license-file = "LICENSE"
repository = "https://github.com/JorisJonkers-dev/rust-commons"
publish = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
base64 = "0.23.1"
form_urlencoded = "1.2.2"
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
ring = "0.17.14"
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["sync"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"

[dev-dependencies]
humantime = "2.4.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
default = ["reqwest"]
# The default Fetch, which asks identity over HTTPS with reqwest and rustls.
reqwest = ["dep:reqwest"]
